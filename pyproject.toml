[project]
name = "montra"
version = "0.1.0"
description = "Personal monthly expense tracker"
readme = "README.md"
authors = [
    { name = "harshit", email = "249226997+sevensixteeeen@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
